<svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- 金币图标 -->
  <!-- 外圈 -->
  <circle cx="12" cy="12" r="10" fill="#FFD700"/>
  <!-- 内圈 -->
  <circle cx="12" cy="12" r="8" fill="#FFA500"/>
  <!-- 中心圈 -->
  <circle cx="12" cy="12" r="6" fill="#FFD700"/>
  <!-- 货币符号 -->
  <text x="12" y="16" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="#FF8C00" text-anchor="middle">¥</text>
  <!-- 高光效果 -->
  <ellipse cx="8" cy="8" rx="3" ry="2" fill="#FFFFFF" opacity="0.4"/>
  <!-- 边缘阴影 -->
  <circle cx="12" cy="12" r="10" fill="none" stroke="#DAA520" stroke-width="0.5"/>
</svg>
