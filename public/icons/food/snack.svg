<svg viewBox="0 0 32 32" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- 零食 - 可爱的饼干 -->
  <!-- 饼干主体 -->
  <circle cx="16" cy="16" r="10" fill="#F4A460"/>
  <!-- 饼干边缘纹理 -->
  <circle cx="16" cy="16" r="10" fill="none" stroke="#D2691E" stroke-width="1" stroke-dasharray="2,2"/>
  <!-- 巧克力豆 -->
  <circle cx="12" cy="12" r="2" fill="#3D2817"/>
  <circle cx="20" cy="13" r="2" fill="#3D2817"/>
  <circle cx="14" cy="18" r="2" fill="#3D2817"/>
  <circle cx="19" cy="19" r="2" fill="#3D2817"/>
  <circle cx="16" cy="15" r="1.5" fill="#3D2817"/>
  <!-- 高光效果 -->
  <circle cx="11" cy="11" r="1" fill="#FFFFFF" opacity="0.6"/>
  <circle cx="19" cy="12" r="1" fill="#FFFFFF" opacity="0.6"/>
  <!-- 饼干裂纹 -->
  <path d="M 10 16 Q 12 15 14 16" stroke="#D2691E" stroke-width="0.5" fill="none" opacity="0.5"/>
  <path d="M 18 16 Q 20 17 22 16" stroke="#D2691E" stroke-width="0.5" fill="none" opacity="0.5"/>
  <!-- 外圈装饰 -->
  <circle cx="16" cy="16" r="11" fill="none" stroke="#FFE4B5" stroke-width="0.5" opacity="0.3"/>
</svg>
