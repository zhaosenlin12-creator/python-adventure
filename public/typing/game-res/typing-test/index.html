<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>打字速度测试</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pixi.js/7.3.2/pixi.min.js"></script>
<style>body{margin:0;padding:0;background-color:#1a1a1a;display:flex;justify-content:center;align-items:center;height:100vh;font-family:monospace;color:#ccc;overflow:hidden;}#game-container{position:relative;width:100%;height:100%;display:flex;justify-content:center;align-items:center;}canvas{display:block;}.back-button{position:fixed;top:20px;left:20px;width:40px;height:40px;cursor:pointer;z-index:1000;border:2px solid #f5a623;border-radius:50%;display:flex;justify-content:center;align-items:center;transition:all 0.3s ease;background:rgba(26,26,26,0.8);}.back-button:hover{background:rgba(245,166,35,0.2);transform:scale(1.1);}.back-button::before{content:'';width:12px;height:12px;border-left:3px solid #f5a623;border-bottom:3px solid #f5a623;transform:rotate(45deg);margin-left:6px;}</style>
</head>
<body>
<div class="back-button" onclick="window.history.back()"></div>
<div id="game-container"></div>
<script src="js/app.js?44"></script>
</body>
</html>
