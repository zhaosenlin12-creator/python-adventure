<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 40 32" fill="none">
  <defs>
    <linearGradient id="wingL" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#a78bfa"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>
    <linearGradient id="wingR" x1="1" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#c084fc"/>
      <stop offset="50%" stop-color="#a78bfa"/>
      <stop offset="100%" stop-color="#7c3aed"/>
    </linearGradient>
    <filter id="bfGlow">
      <feDropShadow dx="0" dy="0" stdDeviation="1.5" flood-color="#a78bfa" flood-opacity="0.4"/>
    </filter>
  </defs>
  <g filter="url(#bfGlow)">
    <!-- Left upper wing -->
    <path d="M20 14 C14 4, 2 2, 4 12 C5 17, 12 20, 20 16 Z" fill="url(#wingL)" opacity="0.85"/>
    <!-- Left lower wing -->
    <path d="M20 16 C14 20, 4 26, 8 20 C10 17, 15 15, 20 16 Z" fill="url(#wingL)" opacity="0.7"/>
    <!-- Right upper wing -->
    <path d="M20 14 C26 4, 38 2, 36 12 C35 17, 28 20, 20 16 Z" fill="url(#wingR)" opacity="0.85"/>
    <!-- Right lower wing -->
    <path d="M20 16 C26 20, 36 26, 32 20 C30 17, 25 15, 20 16 Z" fill="url(#wingR)" opacity="0.7"/>
    <!-- Body -->
    <ellipse cx="20" cy="16" rx="1.2" ry="6" fill="#4c1d95"/>
    <!-- Antennae -->
    <path d="M19 10 C17 6, 15 4, 14 3" stroke="#6d28d9" stroke-width="0.6" fill="none" stroke-linecap="round"/>
    <path d="M21 10 C23 6, 25 4, 26 3" stroke="#6d28d9" stroke-width="0.6" fill="none" stroke-linecap="round"/>
    <circle cx="14" cy="3" r="0.8" fill="#a78bfa"/>
    <circle cx="26" cy="3" r="0.8" fill="#c084fc"/>
    <!-- Wing spots -->
    <circle cx="12" cy="11" r="2.5" fill="#ffffff" opacity="0.3"/>
    <circle cx="28" cy="11" r="2.5" fill="#ffffff" opacity="0.3"/>
    <circle cx="10" cy="19" r="1.5" fill="#ffffff" opacity="0.2"/>
    <circle cx="30" cy="19" r="1.5" fill="#ffffff" opacity="0.2"/>
  </g>
</svg>
