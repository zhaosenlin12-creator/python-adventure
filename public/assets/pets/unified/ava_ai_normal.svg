<svg xmlns='http://www.w3.org/2000/svg' width='96' height='96' viewBox='0 0 96 96'>
  <defs>
    <radialGradient id='aa_body' cx='38%' cy='32%' r='58%'>
      <stop offset='0%' stop-color='#E1BEE7'/><stop offset='40%' stop-color='#CE93D8'/><stop offset='80%' stop-color='#AB47BC'/><stop offset='100%' stop-color='#8E24AA'/>
    </radialGradient>
    <radialGradient id='aa_eye' cx='45%' cy='38%' r='55%'>
      <stop offset='0%' stop-color='#EA80FC'/><stop offset='35%' stop-color='#E040FB'/><stop offset='65%' stop-color='#7C4DFF'/><stop offset='100%' stop-color='#304FFE'/>
    </radialGradient>
    <radialGradient id='aa_glow' cx='50%' cy='50%' r='50%'>
      <stop offset='0%' stop-color='#E040FB' stop-opacity='0.28'/><stop offset='70%' stop-color='#CE93D8' stop-opacity='0.08'/><stop offset='100%' stop-color='#E040FB' stop-opacity='0'/>
    </radialGradient>
    <linearGradient id='aa_ring' x1='0%' y1='0%' x2='100%' y2='0%'>
      <stop offset='0%' stop-color='#E040FB' stop-opacity='0.08'/><stop offset='30%' stop-color='#7C4DFF' stop-opacity='0.5'/><stop offset='70%' stop-color='#E040FB' stop-opacity='0.5'/><stop offset='100%' stop-color='#7C4DFF' stop-opacity='0.08'/>
    </linearGradient>
    <radialGradient id='aa_pupil' cx='50%' cy='45%' r='50%'>
      <stop offset='0%' stop-color='#B388FF'/><stop offset='50%' stop-color='#7C4DFF'/><stop offset='100%' stop-color='#311B92'/>
    </radialGradient>
    <filter id='aa_sh'><feDropShadow dx='0' dy='2' stdDeviation='2' flood-color='#6A1B9A' flood-opacity='0.18'/></filter>
  </defs>
  <g filter='url(#aa_sh)'>
  <g stroke-linecap='round' stroke-linejoin='round'>
    <!-- Outer glow -->
    <circle cx='48' cy='48' r='44' fill='url(#aa_glow)'/>
    <!-- Pulse waves -->
    <circle cx='48' cy='48' r='38' fill='none' stroke='#E040FB' stroke-width='0.6' opacity='0.15'/>
    <circle cx='48' cy='48' r='34' fill='none' stroke='#CE93D8' stroke-width='0.5' opacity='0.1'/>
    <!-- Orbiting rings -->
    <ellipse cx='48' cy='48' rx='40' ry='12' fill='none' stroke='url(#aa_ring)' stroke-width='2.5' opacity='0.55'/>
    <ellipse cx='48' cy='48' rx='34' ry='19' fill='none' stroke='url(#aa_ring)' stroke-width='1.8' opacity='0.25' transform='rotate(35, 48, 48)'/>
    <!-- Orbiting particles -->
    <circle cx='88' cy='48' r='3' fill='#E040FB' opacity='0.65'/><circle cx='87' cy='47' r='1.2' fill='#fff' opacity='0.4'/>
    <circle cx='8' cy='48' r='2.5' fill='#7C4DFF' opacity='0.5'/><circle cx='8.5' cy='47' r='1' fill='#fff' opacity='0.3'/>
    <circle cx='74' cy='59' r='2' fill='#EA80FC' opacity='0.4'/><circle cx='22' cy='37' r='1.8' fill='#B388FF' opacity='0.35'/>
    <!-- Main sphere -->
    <circle cx='48' cy='48' r='28' fill='url(#aa_body)' stroke='#8E24AA' stroke-width='2.5'/>
    <!-- Sphere highlight -->
    <ellipse cx='37' cy='35' rx='14' ry='10' fill='#fff' opacity='0.18'/>
    <ellipse cx='35' cy='33' rx='8' ry='5' fill='#fff' opacity='0.12'/>
    <!-- Central holographic eye -->
    <circle cx='48' cy='46' r='15' fill='url(#aa_eye)' stroke='#6A1B9A' stroke-width='2'/>
    <!-- Eye iris ring -->
    <circle cx='48' cy='46' r='11' fill='none' stroke='#EA80FC' stroke-width='1.5' opacity='0.5'/>
    <circle cx='48' cy='46' r='8' fill='none' stroke='#E040FB' stroke-width='0.8' opacity='0.3'/>
    <!-- Pupil -->
    <circle cx='48' cy='46' r='6.5' fill='url(#aa_pupil)'/>
    <!-- Pupil inner glow -->
    <circle cx='48' cy='46' r='3.5' fill='#B388FF' opacity='0.6'/>
    <circle cx='48' cy='46' r='1.5' fill='#E1BEE7' opacity='0.4'/>
    <!-- Eye highlights -->
    <circle cx='43' cy='42' r='4' fill='#fff' opacity='0.78'/><circle cx='42' cy='41' r='2' fill='#fff' opacity='0.5'/>
    <circle cx='53' cy='50' r='2' fill='#fff' opacity='0.35'/>
    <!-- Scan lines -->
    <line x1='35' y1='44' x2='61' y2='44' stroke='#EA80FC' stroke-width='0.5' opacity='0.25'/>
    <line x1='35' y1='48' x2='61' y2='48' stroke='#EA80FC' stroke-width='0.5' opacity='0.25'/>
    <!-- Cute smile -->
    <path d='M41 58 Q48 65 55 58' stroke='#F3E5F5' stroke-width='2.2' fill='none'/>
    <!-- Cheek glow -->
    <ellipse cx='33' cy='56' rx='4.5' ry='3' fill='#F48FB1' opacity='0.38'/>
    <ellipse cx='63' cy='56' rx='4.5' ry='3' fill='#F48FB1' opacity='0.38'/>
    <!-- Bottom shadow -->
    <ellipse cx='48' cy='87' rx='18' ry='3.5' fill='#8E24AA' opacity='0.15'/>
  </g>
  </g>
</svg>
