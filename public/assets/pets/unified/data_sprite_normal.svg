<svg xmlns='http://www.w3.org/2000/svg' width='96' height='96' viewBox='0 0 96 96'>
  <defs>
    <radialGradient id='ds_body' cx='50%' cy='38%' r='52%'>
      <stop offset='0%' stop-color='#B2DFDB' stop-opacity='0.95'/><stop offset='50%' stop-color='#80CBC4' stop-opacity='0.88'/><stop offset='100%' stop-color='#4DB6AC' stop-opacity='0.72'/>
    </radialGradient>
    <radialGradient id='ds_core' cx='50%' cy='40%' r='50%'>
      <stop offset='0%' stop-color='#fff' stop-opacity='0.92'/><stop offset='60%' stop-color='#E0F7FA' stop-opacity='0.6'/><stop offset='100%' stop-color='#B2EBF2' stop-opacity='0.3'/>
    </radialGradient>
    <radialGradient id='ds_glow' cx='50%' cy='48%' r='50%'>
      <stop offset='0%' stop-color='#00E5FF' stop-opacity='0.35'/><stop offset='70%' stop-color='#00BCD4' stop-opacity='0.1'/><stop offset='100%' stop-color='#00E5FF' stop-opacity='0'/>
    </radialGradient>
    <radialGradient id='ds_iris' cx='40%' cy='35%' r='55%'>
      <stop offset='0%' stop-color='#26C6DA'/><stop offset='60%' stop-color='#00838F'/><stop offset='100%' stop-color='#004D40'/>
    </radialGradient>
    <filter id='ds_sh'><feDropShadow dx='0' dy='1' stdDeviation='2' flood-color='#00695C' flood-opacity='0.15'/></filter>
  </defs>
  <g filter='url(#ds_sh)'>
  <g stroke-linecap='round' stroke-linejoin='round'>
    <!-- Outer glow -->
    <circle cx='48' cy='46' r='40' fill='url(#ds_glow)'/>
    <!-- Particle trails -->
    <circle cx='16' cy='28' r='2.2' fill='#80CBC4' opacity='0.55'/><circle cx='11' cy='44' r='1.8' fill='#4DB6AC' opacity='0.45'/>
    <circle cx='20' cy='60' r='2' fill='#B2DFDB' opacity='0.6'/><circle cx='80' cy='30' r='1.8' fill='#80CBC4' opacity='0.5'/>
    <circle cx='84' cy='48' r='2.2' fill='#4DB6AC' opacity='0.55'/><circle cx='78' cy='64' r='1.5' fill='#B2DFDB' opacity='0.4'/>
    <circle cx='30' cy='16' r='1.5' fill='#00E5FF' opacity='0.55'/><circle cx='66' cy='18' r='1.8' fill='#00E5FF' opacity='0.5'/>
    <circle cx='24' cy='72' r='1.2' fill='#26C6DA' opacity='0.35'/><circle cx='72' cy='72' r='1.2' fill='#26C6DA' opacity='0.35'/>
    <!-- Data stream lines -->
    <line x1='18' y1='34' x2='28' y2='40' stroke='#80CBC4' stroke-width='1' opacity='0.35'/>
    <line x1='68' y1='40' x2='78' y2='34' stroke='#80CBC4' stroke-width='1' opacity='0.35'/>
    <line x1='32' y1='20' x2='38' y2='30' stroke='#80CBC4' stroke-width='0.8' opacity='0.25'/>
    <line x1='58' y1='30' x2='64' y2='20' stroke='#80CBC4' stroke-width='0.8' opacity='0.25'/>
    <!-- Main body (teardrop) -->
    <path d='M48 12 Q26 28 26 48 Q26 70 48 80 Q70 70 70 48 Q70 28 48 12' fill='url(#ds_body)' stroke='#4DB6AC' stroke-width='2'/>
    <!-- Body highlight -->
    <path d='M48 16 Q34 28 34 42 Q34 48 40 50' fill='#B2DFDB' opacity='0.2' stroke='none'/>
    <!-- Inner glow core -->
    <ellipse cx='48' cy='43' rx='15' ry='17' fill='url(#ds_core)'/>
    <!-- Wings/fins -->
    <path d='M26 42 Q16 34 12 38 Q8 43 16 48 Q22 51 26 48' fill='#B2DFDB' stroke='#4DB6AC' stroke-width='1.5' opacity='0.75'/>
    <path d='M70 42 Q80 34 84 38 Q88 43 80 48 Q74 51 70 48' fill='#B2DFDB' stroke='#4DB6AC' stroke-width='1.5' opacity='0.75'/>
    <!-- Fin inner veins -->
    <line x1='18' y1='40' x2='24' y2='45' stroke='#E0F7FA' stroke-width='0.6' opacity='0.5'/>
    <line x1='78' y1='40' x2='72' y2='45' stroke='#E0F7FA' stroke-width='0.6' opacity='0.5'/>
    <!-- Eyes -->
    <ellipse cx='40' cy='41' rx='6.5' ry='7.5' fill='#fff' stroke='#4DB6AC' stroke-width='1.5'/>
    <ellipse cx='56' cy='41' rx='6.5' ry='7.5' fill='#fff' stroke='#4DB6AC' stroke-width='1.5'/>
    <ellipse cx='41' cy='41' rx='4' ry='5' fill='url(#ds_iris)'/><ellipse cx='57' cy='41' rx='4' ry='5' fill='url(#ds_iris)'/>
    <ellipse cx='41' cy='41' rx='2.2' ry='3.2' fill='#004D40'/><ellipse cx='57' cy='41' rx='2.2' ry='3.2' fill='#004D40'/>
    <circle cx='39' cy='39' r='2.2' fill='#fff' opacity='0.9'/><circle cx='55' cy='39' r='2.2' fill='#fff' opacity='0.9'/>
    <circle cx='43' cy='43' r='1' fill='#fff' opacity='0.45'/><circle cx='59' cy='43' r='1' fill='#fff' opacity='0.45'/>
    <!-- Smile -->
    <path d='M43 52 Q48 57 53 52' stroke='#00695C' stroke-width='2' fill='none'/>
    <!-- Cheek glow -->
    <ellipse cx='33' cy='50' rx='4.5' ry='3' fill='#80CBC4' opacity='0.45'/>
    <ellipse cx='63' cy='50' rx='4.5' ry='3' fill='#80CBC4' opacity='0.45'/>
    <!-- Crown sparkle -->
    <path d='M48 16 L46.5 20 L48 18 L49.5 20 Z' fill='#00E5FF' opacity='0.75'/>
    <path d='M44 14 L45 12 L46 14 L45 16 Z' fill='#80DEEA' opacity='0.4'/>
    <path d='M50 14 L51 12 L52 14 L51 16 Z' fill='#80DEEA' opacity='0.4'/>
    <!-- Bottom tail glow -->
    <ellipse cx='48' cy='81' rx='7' ry='4' fill='#80CBC4' opacity='0.35'/>
    <ellipse cx='48' cy='85' rx='4' ry='2.5' fill='#4DB6AC' opacity='0.25'/>
    <circle cx='48' cy='89' r='1.8' fill='#4DB6AC' opacity='0.15'/>
  </g>
  </g>
