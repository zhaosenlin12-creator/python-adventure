    <ellipse cx='44' cy='52' rx='2.2' ry='1.8' fill='#5D4037'/><ellipse cx='52' cy='52' rx='2.2' ry='1.8' fill='#5D4037'/>
    <!-- Smile -->
    <path d='M42 55 Q48 61 54 55' stroke='#5D4037' stroke-width='2' fill='none'/>
    <!-- Cheek blush -->
    <ellipse cx='27' cy='50' rx='5.5' ry='3.5' fill='#FFAB91' opacity='0.45'/>
    <ellipse cx='69' cy='50' rx='5.5' ry='3.5' fill='#FFAB91' opacity='0.45'/>
