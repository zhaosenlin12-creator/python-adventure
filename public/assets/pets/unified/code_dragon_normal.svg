    <path d='M12 44 L14 41 L16 44 L14 47 Z' fill='#FFEB3B' opacity='0.6'/>
    <path d='M82 34 L84 31 L86 34 L84 37 Z' fill='#FFEB3B' opacity='0.5'/>
    <path d='M48 6 L49.5 3 L51 6 L49.5 9 Z' fill='#FF9800' opacity='0.45'/>
