    <line x1='72' y1='36' x2='81' y2='16' stroke='#BF360C' stroke-width='0.8' opacity='0.35'/><line x1='68' y1='34' x2='73' y2='12' stroke='#BF360C' stroke-width='0.8' opacity='0.35'/>
    <!-- Wing highlight -->
