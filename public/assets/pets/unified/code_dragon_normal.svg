<svg xmlns='http://www.w3.org/2000/svg' width='96' height='96' viewBox='0 0 96 96'>
  <defs>
    <radialGradient id='cd_body' cx='45%' cy='35%' r='55%'>
      <stop offset='0%' stop-color='#FFE082'/><stop offset='50%' stop-color='#FFD54F'/><stop offset='100%' stop-color='#F59E0B'/>
    </radialGradient>
    <radialGradient id='cd_belly' cx='50%' cy='45%' r='50%'>
      <stop offset='0%' stop-color='#FFFEF5'/><stop offset='100%' stop-color='#FFECB3'/>
    </radialGradient>
    <linearGradient id='cd_wing' x1='0%' y1='0%' x2='100%' y2='100%'>
      <stop offset='0%' stop-color='#FFAB91'/><stop offset='50%' stop-color='#FF8A65'/><stop offset='100%' stop-color='#E64A19'/>
    </linearGradient>
    <linearGradient id='cd_horn' x1='0%' y1='100%' x2='0%' y2='0%'>
      <stop offset='0%' stop-color='#FFB74D'/><stop offset='100%' stop-color='#FF5722'/>
    </linearGradient>
    <radialGradient id='cd_iris' cx='42%' cy='38%' r='55%'>
      <stop offset='0%' stop-color='#FFAB00'/><stop offset='50%' stop-color='#FF6F00'/><stop offset='100%' stop-color='#E65100'/>
    </radialGradient>
    <linearGradient id='cd_flame' x1='50%' y1='100%' x2='50%' y2='0%'>
      <stop offset='0%' stop-color='#FF5722'/><stop offset='40%' stop-color='#FF9800'/><stop offset='100%' stop-color='#FFEB3B'/>
    </linearGradient>
    <filter id='cd_sh'><feDropShadow dx='0' dy='2' stdDeviation='1.5' flood-color='#5D4037' flood-opacity='0.18'/></filter>
  </defs>
  <g filter='url(#cd_sh)'>
