    <ellipse cx='38' cy='42' rx='7.5' ry='8.5' fill='#fff' stroke='#5D4037' stroke-width='1.5'/>
    <ellipse cx='58' cy='42' rx='7.5' ry='8.5' fill='#fff' stroke='#5D4037' stroke-width='1.5'/>
    <ellipse cx='39' cy='42' rx='4.5' ry='6.5' fill='url(#cd_iris)'/><ellipse cx='59' cy='42' rx='4.5' ry='6.5' fill='url(#cd_iris)'/>
    <!-- Slit pupils -->
    <ellipse cx='39' cy='42' rx='1.5' ry='5.5' fill='#3E2723'/><ellipse cx='59' cy='42' rx='1.5' ry='5.5' fill='#3E2723'/>
    <!-- Eye highlights -->
    <circle cx='36' cy='39' r='2.8' fill='#fff' opacity='0.9'/><circle cx='56' cy='39' r='2.8' fill='#fff' opacity='0.9'/>
    <circle cx='41' cy='44' r='1.2' fill='#fff' opacity='0.45'/><circle cx='61' cy='44' r='1.2' fill='#fff' opacity='0.45'/>
