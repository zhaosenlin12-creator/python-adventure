    <path d='M82 58 Q85 50 80 48 Q77 54 82 58' fill='#FF5722'/><path d='M82 58 Q79 50 84 48 Q85 54 82 58' fill='#FF9800'/>
    <path d='M81 56 Q82 51 80 51' fill='#FFEB3B' opacity='0.8'/><path d='M83 55 Q82 52 84 52' fill='#FFEB3B' opacity='0.6'/>
