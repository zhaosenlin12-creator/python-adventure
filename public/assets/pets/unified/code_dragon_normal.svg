    <path d='M31 28 Q25 12 29 6' fill='url(#cd_horn)' stroke='#5D4037' stroke-width='2'/>
    <path d='M65 28 Q71 12 67 6' fill='url(#cd_horn)' stroke='#5D4037' stroke-width='2'/>
    <path d='M37 26 Q35 16 37 12' fill='#FFB74D' stroke='#5D4037' stroke-width='1.5'/>
    <path d='M59 26 Q61 16 59 12' fill='#FFB74D' stroke='#5D4037' stroke-width='1.5'/>
