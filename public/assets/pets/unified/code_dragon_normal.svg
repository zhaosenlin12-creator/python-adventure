    <path d='M29 22 Q27 14 29 8' stroke='#FFCC80' stroke-width='0.8' fill='none' opacity='0.4'/>
    <path d='M67 22 Q69 14 67 8' stroke='#FFCC80' stroke-width='0.8' fill='none' opacity='0.4'/>
