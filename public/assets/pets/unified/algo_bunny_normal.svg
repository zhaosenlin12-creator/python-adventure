    <path d='M80 24 L81.5 21 L83 24 L81.5 27 Z' fill='#FFD93D' opacity='0.5'/>
    <path d='M12 42 L13.5 39 L15 42 L13.5 45 Z' fill='#FFD93D' opacity='0.4'/>
