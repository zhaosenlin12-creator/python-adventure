<svg xmlns='http://www.w3.org/2000/svg' width='96' height='96' viewBox='0 0 96 96'>
  <defs>
    <radialGradient id='ab_body' cx='45%' cy='35%' r='55%'>
      <stop offset='0%' stop-color='#FFF9C4'/><stop offset='50%' stop-color='#FFE082'/><stop offset='100%' stop-color='#FFD93D'/>
    </radialGradient>
    <radialGradient id='ab_belly' cx='50%' cy='40%' r='50%'>
      <stop offset='0%' stop-color='#FFFEF5'/><stop offset='100%' stop-color='#FFF9C4'/>
    </radialGradient>
    <radialGradient id='ab_iris' cx='40%' cy='35%' r='55%'>
      <stop offset='0%' stop-color='#42A5F5'/><stop offset='60%' stop-color='#1565C0'/><stop offset='100%' stop-color='#0D47A1'/>
    </radialGradient>
    <radialGradient id='ab_glow' cx='50%' cy='50%' r='50%'>
      <stop offset='0%' stop-color='#FFF176' stop-opacity='0.5'/><stop offset='100%' stop-color='#FFF176' stop-opacity='0'/>
    </radialGradient>
    <filter id='ab_sh'><feDropShadow dx='0' dy='2' stdDeviation='1.5' flood-color='#6D4C41' flood-opacity='0.18'/></filter>
  </defs>
  <g filter='url(#ab_sh)'>
