    <!-- Backpack -->
    <rect x='56' y='55' width='17' height='22' rx='5' fill='#FF7043' stroke='#BF360C' stroke-width='1.5'/>
    <rect x='58' y='57' width='13' height='7' rx='2.5' fill='#FF8A65'/>
    <rect x='60' y='66' width='9' height='5' rx='1.5' fill='#D84315'/><line x1='64.5' y1='66' x2='64.5' y2='71' stroke='#BF360C' stroke-width='1'/>
    <rect x='59' y='73' width='11' height='2' rx='1' fill='#FFAB91' opacity='0.5'/>
    <!-- Antenna ears -->
    <path d='M36 32 Q29 2 26 -4' fill='none' stroke='#FFD93D' stroke-width='4'/>
    <path d='M60 32 Q67 2 70 -4' fill='none' stroke='#FFD93D' stroke-width='4'/>
    <path d='M36 32 Q29 2 26 -4' fill='none' stroke='#6D4C41' stroke-width='1.5'/>
    <path d='M60 32 Q67 2 70 -4' fill='none' stroke='#6D4C41' stroke-width='1.5'/>
    <!-- Ear inner pink -->
    <path d='M35 30 Q30 6 27 -1' fill='none' stroke='#FFB4B4' stroke-width='2' opacity='0.6'/>
    <path d='M61 30 Q66 6 69 -1' fill='none' stroke='#FFB4B4' stroke-width='2' opacity='0.6'/>
    <!-- Antenna glow tips -->
    <circle cx='26' cy='-3' r='4' fill='url(#ab_glow)'/><circle cx='26' cy='-3' r='2.5' fill='#FFF176' opacity='0.8'/>
    <circle cx='70' cy='-3' r='4' fill='url(#ab_glow)'/><circle cx='70' cy='-3' r='2.5' fill='#FFF176' opacity='0.8'/>
