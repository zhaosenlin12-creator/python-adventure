    <ellipse cx='36' cy='86' rx='8' ry='4.5' fill='#FFE082'/><ellipse cx='60' cy='86' rx='8' ry='4.5' fill='#FFE082'/>
    <ellipse cx='36' cy='87' rx='5' ry='2.5' fill='#FFFEF5'/><ellipse cx='60' cy='87' rx='5' ry='2.5' fill='#FFFEF5'/>
