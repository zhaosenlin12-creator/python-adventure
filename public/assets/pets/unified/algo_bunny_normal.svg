    <ellipse cx='48' cy='53' rx='3.5' ry='2.5' fill='#FF8A80' stroke='#D3675A' stroke-width='0.6'/>
    <!-- Mouth + teeth -->
    <path d='M48 55.5 Q43.5 60 41.5 57.5' stroke='#6D4C41' stroke-width='1.5' fill='none'/>
    <path d='M48 55.5 Q52.5 60 54.5 57.5' stroke='#6D4C41' stroke-width='1.5' fill='none'/>
    <rect x='45' y='55.5' width='3.2' height='4' rx='1' fill='#fff' stroke='#6D4C41' stroke-width='0.8'/>
    <rect x='48.2' y='55.5' width='3.2' height='4' rx='1' fill='#fff' stroke='#6D4C41' stroke-width='0.8'/>
