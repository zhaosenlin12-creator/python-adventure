    <ellipse cx='38' cy='46' rx='7.5' ry='8.5' fill='#fff' stroke='#6D4C41' stroke-width='1.5'/>
    <ellipse cx='58' cy='46' rx='7.5' ry='8.5' fill='#fff' stroke='#6D4C41' stroke-width='1.5'/>
    <ellipse cx='39' cy='46' rx='4.5' ry='6' fill='url(#ab_iris)'/><ellipse cx='59' cy='46' rx='4.5' ry='6' fill='url(#ab_iris)'/>
    <ellipse cx='39' cy='46' rx='2.5' ry='4' fill='#0D47A1'/><ellipse cx='59' cy='46' rx='2.5' ry='4' fill='#0D47A1'/>
    <circle cx='36' cy='43' r='2.5' fill='#fff' opacity='0.9'/><circle cx='56' cy='43' r='2.5' fill='#fff' opacity='0.9'/>
    <circle cx='41' cy='48' r='1.2' fill='#fff' opacity='0.45'/><circle cx='61' cy='48' r='1.2' fill='#fff' opacity='0.45'/>
